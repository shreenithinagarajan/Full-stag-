<head>

    <style>

        }

        .inline-block{

        }

            list-style: none;
        }
        .link{
            text-decoration:none;
            color: black;
            padding: 10px;
            background-color: brown;
            border-radius: 10px;
        }
        .link:hover{
            cursor: pointer;
            background-color: crimson;
            color: darkslategray;
        }
    </style>
</head>
